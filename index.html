<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Palash Chandra Barman is a Flutter and mobile application developer in Dhaka, building Android and iOS products with clean architecture." />
    <meta name="theme-color" content="#0e0f0c" />

    <link rel="preload" href="/images/palash.jpg" as="image" fetchpriority="high" />
    <script>
      try {
        var stored = localStorage.getItem('theme')
        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>

  </body>
